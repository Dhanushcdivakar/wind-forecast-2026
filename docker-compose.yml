services:
  backend:
    build: ./backend
    environment:
      DATA_MODE: elexon
      ELEXON_BASE_URL: https://data.elexon.co.uk/bmrs/api/v1/datasets
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
